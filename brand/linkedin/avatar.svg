<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1240"/>
      <stop offset="55%" stop-color="#15102E"/>
      <stop offset="100%" stop-color="#0B0820"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#8B7BFF" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#8B7BFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#8B7BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5DECDC"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="overlap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="50%" stop-color="#FF6B9D"/>
      <stop offset="100%" stop-color="#5DECDC"/>
    </linearGradient>
    <clipPath id="rightCircle">
      <circle cx="240" cy="200" r="78"/>
    </clipPath>
  </defs>

  <!-- Rounded square background -->
  <rect width="400" height="400" rx="84" fill="url(#bg)"/>
  <rect width="400" height="400" rx="84" fill="url(#glow)"/>

  <!-- Two overlapping rings: violet (left) + teal (right). Overlap renders as a magenta lens via clipped overlay. -->
  <g>
    <!-- Left ring -->
    <circle cx="160" cy="200" r="78" fill="none" stroke="url(#violet)" stroke-width="20"/>
    <!-- Right ring -->
    <circle cx="240" cy="200" r="78" fill="none" stroke="url(#teal)" stroke-width="20"/>
    <!-- Overlap arc — drawn as the left ring clipped to the right circle, recolored magenta-ish gradient -->
    <g clip-path="url(#rightCircle)">
      <circle cx="160" cy="200" r="78" fill="none" stroke="url(#overlap)" stroke-width="20"/>
    </g>
  </g>

  <!-- Center connection node (the "match") -->
  <circle cx="200" cy="200" r="10" fill="#FFFFFF"/>
  <circle cx="200" cy="200" r="10" fill="#FF6B9D" opacity="0.85"/>
</svg>
