<svg width="1584" height="396" viewBox="0 0 1584 396" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0820"/>
      <stop offset="55%" stop-color="#15102E"/>
      <stop offset="100%" stop-color="#0B0820"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#8B7BFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8B7BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="78%" cy="65%" r="40%">
      <stop offset="0%" stop-color="#5DECDC" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#5DECDC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="92%" cy="20%" r="25%">
      <stop offset="0%" stop-color="#FF6B9D" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF6B9D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B7BFF"/>
      <stop offset="55%" stop-color="#5DECDC"/>
      <stop offset="100%" stop-color="#FF6B9D"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B7BFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8B7BFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5DECDC" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1584" height="396" fill="url(#bg)"/>
  <rect width="1584" height="396" fill="url(#glow1)"/>
  <rect width="1584" height="396" fill="url(#glow2)"/>
  <rect width="1584" height="396" fill="url(#glow3)"/>

  <!-- Faint constellation: nodes + connecting lines, suggesting a network -->
  <g opacity="0.55">
    <line x1="120" y1="280" x2="320" y2="180" stroke="url(#line)" stroke-width="1.2"/>
    <line x1="320" y1="180" x2="540" y2="260" stroke="url(#line)" stroke-width="1.2"/>
    <line x1="540" y1="260" x2="760" y2="160" stroke="url(#line)" stroke-width="1.2"/>
    <line x1="760" y1="160" x2="980" y2="240" stroke="url(#line)" stroke-width="1.2"/>
    <line x1="980" y1="240" x2="1200" y2="170" stroke="url(#line)" stroke-width="1.2"/>
    <line x1="1200" y1="170" x2="1420" y2="280" stroke="url(#line)" stroke-width="1.2"/>
    <circle cx="120" cy="280" r="3" fill="#8B7BFF"/>
    <circle cx="320" cy="180" r="4" fill="#8B7BFF"/>
    <circle cx="540" cy="260" r="3" fill="#5DECDC"/>
    <circle cx="760" cy="160" r="5" fill="#5DECDC"/>
    <circle cx="980" cy="240" r="3" fill="#8B7BFF"/>
    <circle cx="1200" cy="170" r="4" fill="#FF6B9D"/>
    <circle cx="1420" cy="280" r="3" fill="#5DECDC"/>
  </g>

  <!-- Centered headline. LinkedIn covers crop ~196px from top on desktop and avatar overlaps lower-left, so we keep type centered & in safe zone. -->
  <g transform="translate(792,168)" text-anchor="middle" font-family="Plus Jakarta Sans, -apple-system, Segoe UI, sans-serif">
    <text y="0" font-size="68" font-weight="700" fill="url(#grad)" letter-spacing="-1.5">Cleya</text>
    <text y="58" font-size="26" font-weight="500" fill="#E8EBF5" letter-spacing="0.2">The AI matchmaker for India's startup ecosystem</text>
    <text y="98" font-size="16" font-weight="400" fill="#9CA3AF" letter-spacing="0.3">Founders · Investors · Operators · Warm intros, on demand</text>
  </g>
</svg>
